<!DOCTYPE html>
<html lang="en" class="h-full select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Henry Island — Where magical things happen. Animal Crossing Christmas Island daily mini-games for the Henry family." />
    <title>Henry Island 🎄🏝️</title>
    <!-- Tailwind / Custom Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Quicksand:wght@500;700;800&display=swap');
      body {
        font-family: 'Fredoka', 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.1);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.5);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.8);
      }
    </style>
  </head>
  <body class="h-full w-full overflow-hidden flex flex-col bg-slate-900 text-slate-100">
    
    <!-- Top Island Navigation Bar -->
    <header class="relative z-30 shrink-0 bg-gradient-to-r from-sky-950/90 via-blue-900/90 to-indigo-950/90 backdrop-blur-md border-b-2 border-sky-400/40 px-3 py-2 flex items-center justify-between shadow-lg">
      
      <!-- Brand & Date -->
      <div class="flex items-center gap-2">
        <span class="text-2xl sm:text-3xl animate-bounce">🎄</span>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-1.5">
            <span>Henry Island</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-red-600/90 text-white font-extrabold border border-red-400 shadow-sm">Christmas</span>
          </h1>
          <p id="island-date-display" class="text-[11px] sm:text-xs text-sky-200 font-semibold"></p>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        
        <!-- Active Gardener Avatar Badge -->
        <button id="header-avatar-btn" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 active:bg-white/30 border border-amber-400/70 rounded-full px-2.5 py-1 text-xs font-bold text-white shadow-sm transition transform active:scale-95">
          <span id="header-avatar-emoji" class="text-lg">🎅</span>
          <span id="header-avatar-name" class="max-w-[70px] sm:max-w-[100px] truncate">Player</span>
          <span class="px-1.5 py-0.2 rounded-full bg-amber-400 text-slate-900 font-black text-[10px]" id="header-avatar-score">0 pts</span>
        </button>

        <!-- Podium / Leaderboard Button -->
        <button id="header-podium-btn" title="View Snowman Podium" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-slate-950 font-black px-2.5 py-1 rounded-full text-xs shadow-md border border-amber-300 transition transform active:scale-95">
          <span>🏆</span>
          <span class="hidden sm:inline">Podium</span>
        </button>

        <!-- Sound Toggle -->
        <button id="header-sound-btn" title="Toggle Music & Sound Effects" class="w-8 h-8 rounded-full bg-sky-800/80 hover:bg-sky-700 active:bg-sky-600 text-white flex items-center justify-center text-sm border border-sky-400/50 shadow transition transform active:scale-95">
          🔊
        </button>

      </div>
    </header>

    <!-- Main Canvas Viewport -->
    <main class="relative flex-1 w-full h-full overflow-hidden bg-sky-950">
      <canvas id="island-canvas" class="w-full h-full block cursor-pointer"></canvas>

      <!-- Fast Navigation Quick-Travel Dock (Bottom-Center) -->
      <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 bg-slate-900/85 backdrop-blur-md px-3 py-1.5 rounded-2xl border-2 border-sky-400/60 shadow-2xl">
        <button id="travel-wordle" class="px-2.5 py-1 rounded-xl bg-emerald-800/80 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs flex items-center gap-1 border border-emerald-500 transition">
          <span>🟩</span>
          <span class="hidden sm:inline">Wordle Cottage</span>
        </button>

        <button id="travel-town" class="px-2.5 py-1 rounded-xl bg-amber-600/80 hover:bg-amber-500 active:scale-95 text-white font-bold text-xs flex items-center gap-1 border border-amber-400 transition">
          <span>⛄</span>
          <span>Town Square</span>
        </button>

        <button id="travel-lake" class="px-2.5 py-1 rounded-xl bg-sky-700/80 hover:bg-sky-600 active:scale-95 text-white font-bold text-xs flex items-center gap-1 border border-sky-400 transition">
          <span>🪷</span>
          <span class="hidden sm:inline">Frozen Lake</span>
        </button>

        <button id="travel-quiz" class="px-2.5 py-1 rounded-xl bg-indigo-800/80 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xs flex items-center gap-1 border border-indigo-500 transition">
          <span>🧠</span>
          <span class="hidden sm:inline">Quiz Lodge</span>
        </button>
      </div>

      <!-- Virtual Touch Joystick (Bottom Left, visible on mobile / touch) -->
      <div id="joystick-container" class="absolute bottom-5 left-5 z-20 hidden sm:block opacity-90 hover:opacity-100 transition-opacity"></div>

      <!-- Controls Guidance / Tutorial Pill -->
      <div class="absolute top-3 left-3 z-20 pointer-events-none hidden md:flex items-center gap-2 bg-slate-900/70 backdrop-blur-sm px-3 py-1 rounded-xl border border-white/20 text-xs text-sky-200">
        <span>🎮 WASD / Arrows / Click to Walk</span>
        <span>•</span>
        <span>Tap Avatar for Daily Status</span>
      </div>

    </main>

    <!-- Modal Host Layer -->
    <div id="modal-host"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
